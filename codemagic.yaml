workflows:
  ios-step-06-2:
    name: Step 06.2 - Keychain session persistence
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    cache:
      cache_paths:
        - $HOME/.nuget/packages

    scripts:
      - name: Test + build Step 06.2 unsigned IPA
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic-build.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-06.2.ipa
      - artifacts/step06.2-build-summary.txt
      - artifacts/test-results/**
      - artifacts/logs/**
