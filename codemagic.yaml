workflows:
  ios-step-12-4-1:
    name: Step 12.4.1 - download-cache test control
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    cache:
      cache_paths:
        - $HOME/.nuget/packages

    scripts:
      - name: Test + build Step 12.4.1 unsigned IPA
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic-build.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-12.4.1.ipa
      - artifacts/step12.4.1-build-summary.txt
      - artifacts/test-results/**
      - artifacts/logs/**
