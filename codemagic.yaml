workflows:
  ios-canonical:
    name: Steps 53-57 - single-player submenu continuation
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    # Keep this workflow key stable across Step 33+ candidates. Codemagic caches are
    # workflow-scoped, so changing the key for every numbered step would force cold caches.
    cache:
      cache_paths:
        # Existing dependency caches.
        - $HOME/.nuget/packages
        - $CM_BUILD_DIR/.nuget/packages
        - $HOME/.cache/sts2launcher/godot-step15

        # Reuse the exact pinned .NET SDK + iOS workload instead of downloading/installing
        # 9.0.314 / 9.0.314.3 on every canonical run. The build script still verifies
        # the SDK version and workload marker before trusting this cache.
        - $HOME/.dotnet

        # Dominant Step-32 timing sink: .NET iOS publish/AOT intermediates.
        # Cache only the canonical Release/net9.0-ios/ios-arm64 intermediate tree;
        # MSBuild remains responsible for invalidating inputs that actually changed.
        - $CM_BUILD_DIR/src/StS2Launcher.iOS/obj/Release/net9.0-ios/ios-arm64

        # .NET iOS Mono AOT incremental dependency sentinels. The 0.0.182
        # binlog proved that the large obj/AOT cache restored correctly, but
        # AOTCompileInputs.cache.uptodate was absent, so LLVM opt/llc still
        # reran across the AOT set. Cache only these tiny dependency markers,
        # not the whole bin tree; MSBuild remains the invalidation authority.
        - $CM_BUILD_DIR/src/StS2Launcher.iOS/bin/Release/net9.0-ios/ios-arm64/AOTCompileInputs.cache
        - $CM_BUILD_DIR/src/StS2Launcher.iOS/bin/Release/net9.0-ios/ios-arm64/AOTCompileInputs.cache.uptodate

    scripts:
      - name: Validate, test, build, and verify Steps 53-57 single-player submenu continuation
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic.sh

    artifacts:
      - artifacts/StS2-Launcher-Steps-53-57.ipa
      - artifacts/reports/**
      - artifacts/test-results/**
      - artifacts/logs/**
