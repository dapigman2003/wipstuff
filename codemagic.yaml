workflows:
  ios-canonical:
    name: Step 35.0.31 / Step 36.0 - UI Return Fix + Controlled ExecuteEssential
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    # Keep this workflow key stable across Step 33+ candidates. Codemagic caches are
    # workflow-scoped, so changing the key for every numbered step would force cold caches.
    cache:
      cache_paths:
        # Existing dependency caches.
        - $HOME/.nuget/packages
        - $CM_BUILD_DIR/.nuget/packages
        - $HOME/.cache/sts2launcher/godot-step15

        # Reuse the exact pinned .NET SDK + iOS workload instead of downloading/installing
        # 9.0.314 / 9.0.314.3 on every canonical run. The build script still verifies
        # the SDK version and workload marker before trusting this cache.
        - $HOME/.dotnet

        # Dominant Step-32 timing sink: .NET iOS publish/AOT intermediates.
        # Cache only the canonical Release/net9.0-ios/ios-arm64 intermediate tree;
        # MSBuild remains responsible for invalidating inputs that actually changed.
        - $CM_BUILD_DIR/src/StS2Launcher.iOS/obj/Release/net9.0-ios/ios-arm64

    scripts:
      - name: Validate, test, build, and verify Step 36.0
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-36.ipa
      - artifacts/reports/**
      - artifacts/test-results/**
      - artifacts/logs/**
