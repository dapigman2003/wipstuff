workflows:
  ios-step-18-3:
    name: Step 18.3 - Workspace Version-Unification Resolver Fix
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    cache:
      cache_paths:
        - $HOME/.nuget/packages
        - $HOME/.cache/sts2launcher/godot-step15

    scripts:
      - name: Test + build Step 18 unsigned IPA
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic-build-step18.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-18.ipa
      - artifacts/step18-build-summary.txt
      - artifacts/test-results/**
      - artifacts/logs/**
