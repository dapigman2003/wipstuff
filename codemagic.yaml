workflows:
  ios-step-30:
    name: Step 30 - Selected Harmony Target Semantic Context Audit
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    cache:
      cache_paths:
        - $HOME/.nuget/packages
        - $HOME/.cache/sts2launcher/godot-step15

    scripts:
      - name: Validate, test, build, and verify Step 30
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-30.ipa
      - artifacts/reports/**
      - artifacts/test-results/**
      - artifacts/logs/**
