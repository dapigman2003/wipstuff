workflows:
  ios-step-19-2:
    name: Step 19.2 - Host Expression Fallback and Framework Boundary
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    cache:
      cache_paths:
        - $HOME/.nuget/packages
        - $HOME/.cache/sts2launcher/godot-step15

    scripts:
      - name: Test + build Step 19.2 unsigned IPA
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic-build-step19.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-19.ipa
      - artifacts/step19-build-summary.txt
      - artifacts/test-results/**
      - artifacts/logs/**
