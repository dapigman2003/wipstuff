workflows:
  ios-step-03:
    name: Step 03 - Pure managed Core state machine
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      xcode: 26.5
      vars:
        DOTNET_SDK_VERSION: "9.0.314"
        DOTNET_WORKLOAD_SET: "9.0.314.3"

    cache:
      cache_paths:
        - $HOME/.nuget/packages

    scripts:
      - name: Build Step 03 unsigned IPA
        script: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash scripts/codemagic-build.sh

    artifacts:
      - artifacts/StS2-Launcher-Step-03.ipa
      - artifacts/step03-build-summary.txt
      - artifacts/logs/**
